name: ci

# The required gate. TODOS.md CI-001 and CI-002.
#
# Every job here is deterministic and offline. SCHEMAFLUX_LIVE_TESTS is never
# set, so the provider-backed tests compile and skip -- see B-04. Nothing in
# this file may reach a paid endpoint.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The platform contract. This repository already carries a defect class that
  # only reproduces where -race cannot run (see F-031), which is the argument
  # for testing somewhere other than the maintainer's machine.
  test:
    name: test ${{ matrix.os }} / go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        # Only `stable`. `oldstable` was here and did nothing: go.mod declares
        # go 1.25.0 with no toolchain directive, and since Go 1.21 the default
        # GOTOOLCHAIN=auto silently downloads and switches to whatever go.mod
        # requires whenever the installed toolchain is older. So the oldstable
        # leg fetched 1.25 and re-ran the stable leg's tests under a label
        # claiming otherwise -- a matrix entry that costs CI minutes and tests
        # nothing. Restoring real old-Go coverage means lowering the go.mod
        # directive, which is a compatibility decision, not a CI one.
        go: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # -race is the reason the Linux jobs exist: it does not run on
      # windows/arm64, which is where this library is developed, so the package
      # globals it would catch go unchecked locally. TI-008.
      - name: Test with the race detector
        if: runner.os != 'Windows'
        run: go test -race ./...

      # Order dependence and shared package state hide from a single ordered
      # run. Ten shuffled runs is cheap and has found real bugs in this kind of
      # library.
      - name: Test shuffled
        run: go test -shuffle=on -count=10 ./...

      - name: Vet
        run: go vet ./...

  # The same one command the maintainer runs locally (AGENTS.md, CONTRIBUTING.md).
  # It exists because the required-check list lived in three places that drifted
  # apart, and a contributor could satisfy either document and still be
  # surprised here. This job is the tiebreaker: if check.sh passes and CI does
  # not, the script is wrong and that is a bug worth fixing rather than working
  # around.
  #
  # The dedicated jobs below still run individually, because a single failing
  # step in a combined script is harder to read on a pull request than a red
  # job with a name on it.
  one-command-check:
    name: scripts/check.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Run every gate in one command
        run: ./scripts/check.sh --fast

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # gofmt is only a gate now that CI-003 normalized line endings. Before
      # that it reported 179 files, 162 of which differed by nothing but CRLF.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Examples build
        run: go build ./examples/...

      # CI-004. The examples are the documented feature set, and a documented
      # feature that does not run is a claim. Ratcheted: an example that passes
      # and then breaks fails the build, and so does one that starts passing
      # without being recorded.
      - name: Examples run
        run: python3 scripts/examples_gate.py

      # CI-005. The floor is what was measured, and it only moves up.
      - name: Coverage floor
        run: python3 scripts/coverage_floor.py

      # CI-007. An accidental export is a compatibility promise nobody decided
      # to make; a removal is a broken build for somebody who did not ask.
      - name: Public API surface
        run: go test . -run TestPublicAPISurface

      # A dirty tree after a build means something generated a file nobody
      # committed.
      - name: Working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the working tree is dirty after building:"
            git status --porcelain
            exit 1
          fi

  # CI-006. A fixture is the most likely place for a real key to be pasted by
  # accident, and this repository ships one.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scanner self-test
        run: python3 scripts/secret_scan.py --self-test
      - name: Scan for credentials
        run: python3 scripts/secret_scan.py

  # RC-004. catalog.go already records which operations are TierDeprecated
  # and what replaces them; this checks the source backs that promise up with
  # an actual `// Deprecated:` marker naming the replacement, rather than
  # trusting the table.
  deprecation-policy:
    name: deprecation policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checker self-test
        run: python3 scripts/deprecation_policy.py --self-test
      - name: Deprecated catalog entries carry a source marker
        run: python3 scripts/deprecation_policy.py --check

  # RC-003. §19 of to-production.md is the v1.0.0 acceptance checklist; this
  # is the parser and drift check for the ledger TODOS.md now carries. The
  # ledger exists, so --check is a real gate rather than a job that would be
  # permanently red -- which is why it was self-test-only until now: a gate
  # that always fails is a gate people learn to scroll past.
  #
  # What it catches is drift in both directions: a criterion added to §19 with
  # no ledger line, a ledger line whose wording has gone stale against the
  # specification, an unchecked box with no stated reason, and an ID that no
  # longer exists. It does NOT check whether a ticked box is *true* -- nothing
  # can -- so ticking one remains a claim somebody has to stand behind.
  acceptance-checklist:
    name: acceptance checklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checker self-test
        run: python3 scripts/acceptance_checklist.py --self-test
      - name: Ledger matches the specification
        run: python3 scripts/acceptance_checklist.py --check

  # The review is the input to TODOS.md, and that relationship is only worth
  # anything if it is checkable. TR-001.
  traceability:
    name: traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every finding traces to a task
        run: python3 .audit/traceability.py

  # REL-001's ladder lived only in TODOS.md, which made it a statement of
  # intent: nothing stopped a tag being cut while the milestone it depends on
  # still had open work. A version number is the one claim a consumer cannot
  # inspect for themselves, so it gets a gate.
  #
  # fetch-depth 0 and fetch-tags, because the check compares against the tags
  # that exist and a shallow clone has none.
  release-ladder:
    name: release ladder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: No tag ahead of the work it claims
        run: python3 scripts/release_gate.py --check

      # RC-001. Generated, not transcribed: the sections come from the API
      # surface snapshot, the golden prompts, the deprecation catalogue, and
      # the section 19 ledger, so they cannot drift from the facts they
      # describe. Run without --check here because no tag exists yet and the
      # semantic benchmark section is legitimately unavailable until RC-002
      # lands. At release time it is `--check`, which refuses to emit notes
      # with a section it could not compute.
      - name: Release notes assemble from evidence
        run: |
          python3 scripts/release_notes.py --since "$(git rev-list --max-parents=0 HEAD | tail -1)"

  smarttodo:
    name: smarttodo module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build
        working-directory: examples/smarttodo
        run: go build ./...
      - name: Test
        working-directory: examples/smarttodo
        run: go test ./...
